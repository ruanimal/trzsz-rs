name: Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # cargo build (native host compilation)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cargo
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cargo
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            build_tool: cargo
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            build_tool: cargo
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build_tool: cargo
            archive: zip
          # cross (Docker-based cross-compilation)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cross
            archive: tar.gz
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            build_tool: cross
            archive: tar.gz
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            build_tool: cross
            archive: tar.gz
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            build_tool: cross
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build_tool: cross
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            build_tool: cross
            archive: zip
          # zigbuild + nightly (no cross Docker image, nightly has prebuilt rust-std)
          - target: s390x-unknown-linux-musl
            os: ubuntu-latest
            build_tool: zigbuild
            no_default_features: true
            archive: tar.gz
          - target: powerpc64le-unknown-linux-musl
            os: ubuntu-latest
            build_tool: zigbuild
            no_default_features: true
            archive: tar.gz
          - target: riscv64gc-unknown-linux-musl
            os: ubuntu-latest
            build_tool: zigbuild
            no_default_features: true
            archive: tar.gz
          # musl-cross + build-std (prebuilt musl GCC cross-compiler, no portable_pty)
          - target: mips-unknown-linux-musl
            os: ubuntu-latest
            build_tool: musl_cross
            no_default_features: true
            archive: tar.gz
          - target: mipsel-unknown-linux-musl
            os: ubuntu-latest
            build_tool: musl_cross
            no_default_features: true
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust nightly
        if: matrix.build_tool == 'zigbuild'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install rust-src (musl_cross)
        if: matrix.build_tool == 'musl_cross'
        run: rustup component add rust-src

      - name: Install rust target
        if: matrix.build_tool == 'cargo'
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.build_tool == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install cargo-zigbuild
        if: matrix.build_tool == 'zigbuild'
        run: pip install ziglang && cargo install cargo-zigbuild

      - name: Install musl-cross GCC (musl_cross)
        if: matrix.build_tool == 'musl_cross'
        run: |
          MUSL_TARGET=$(echo '${{ matrix.target }}' | sed 's/-unknown-linux-musl/-unknown-linux-muslsf/' | sed 's/labihf/sf/')
          echo "MUSL_TARGET=${MUSL_TARGET}" >> $GITHUB_ENV
          mkdir -p ./musl_gcc
          wget --inet4-only -c "https://github.com/cross-tools/musl-cross/releases/download/20250520/${MUSL_TARGET}.tar.xz" -P ./musl_gcc/
          tar xf "./musl_gcc/${MUSL_TARGET}.tar.xz" -C ./musl_gcc/
          sudo ln -sf "$(pwd)/musl_gcc/${MUSL_TARGET}/bin/"*gcc /usr/bin/
          sudo ln -sf "$(pwd)/musl_gcc/${MUSL_TARGET}/include/" /usr/include/musl-cross
          sudo ln -sf "$(pwd)/musl_gcc/${MUSL_TARGET}/${MUSL_TARGET}/sysroot/" ./musl_gcc/sysroot
          # Fix libunwind for panic=abort
          cd "./musl_gcc/${MUSL_TARGET}/lib/gcc/${MUSL_TARGET}/"15*/ || exit 0
          if [ -f libgcc_eh.a ] && [ ! -f libunwind.a ]; then
            sudo cp libgcc_eh.a libunwind.a
          fi

      - name: Build (cargo)
        if: matrix.build_tool == 'cargo'
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.no_default_features && '--no-default-features' || '' }}

      - name: Build (cross)
        if: matrix.build_tool == 'cross'
        run: cross build --release --locked --target ${{ matrix.target }} ${{ matrix.no_default_features && '--no-default-features' || '' }}

      - name: Build (zigbuild)
        if: matrix.build_tool == 'zigbuild'
        run: cargo +nightly zigbuild --release --locked --target ${{ matrix.target }} -Zbuild-std=std,panic_abort ${{ matrix.no_default_features && '--no-default-features' || '' }}
        env:
          RUSTFLAGS: -C link-self-contained=no

      - name: Build (musl_cross)
        if: matrix.build_tool == 'musl_cross'
        run: |
          MUSL_BIN="$PWD/musl_gcc/$MUSL_TARGET/bin/$MUSL_TARGET"
          TARGET_VAR=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          export CC_${TARGET_VAR}="${MUSL_BIN}-gcc"
          export CARGO_TARGET_${TARGET_VAR}_LINKER="${MUSL_BIN}-gcc"
          cargo build --release --locked --target ${{ matrix.target }} -Z build-std=std,panic_abort ${{ matrix.no_default_features && '--no-default-features' || '' }}
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: -C link-self-contained=no

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../trzsz-${{ matrix.target }}.tar.gz trzsz trz tsz

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../trzsz-${{ matrix.target }}.zip trzsz.exe trz.exe tsz.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trzsz-${{ matrix.target }}
          path: trzsz-*
