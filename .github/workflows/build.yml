name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux musl targets (with pty)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz
          # Linux musl targets (without pty, portable_pty not supported)
          - target: s390x-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            no_default_features: true
            archive: tar.gz
          - target: powerpc64le-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            no_default_features: true
            archive: tar.gz
          - target: riscv64gc-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            no_default_features: true
            archive: tar.gz
          - target: mips-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            no_default_features: true
            archive: tar.gz
          - target: mipsel-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            no_default_features: true
            archive: tar.gz
          - target: mips64el-unknown-linux-muslabi64
            os: ubuntu-latest
            use_cross: true
            no_default_features: true
            archive: tar.gz
          - target: mips64-unknown-linux-muslabi64
            os: ubuntu-latest
            use_cross: true
            no_default_features: true
            archive: tar.gz
          # Linux glibc targets
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive: tar.gz
          # macOS targets
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive: tar.gz
          # Windows targets
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive: zip
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            use_cross: true
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install rust target
        if: "!matrix.use_cross"
        run: rustup target add ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }} ${{ matrix.no_default_features && '--no-default-features' || '' }}

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.no_default_features && '--no-default-features' || '' }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../trzsz-${{ matrix.target }}.tar.gz trzsz trz tsz

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../trzsz-${{ matrix.target }}.zip trzsz.exe trz.exe tsz.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trzsz-${{ matrix.target }}
          path: trzsz-*
